name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  smoke:
    name: Live deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check frontend routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/dashboard"
            "/logs"
            "/auto-heal"
            "/agents"
            "/account"
            "/monitoring"
          )
          for route in "${routes[@]}"; do
            status="$(curl -sS -L -o /tmp/devpilot-page.html -w "%{http_code}" "https://devpilot-ai-two.vercel.app${route}")"
            test "$status" = "200"
            grep -qi "DevPilot" /tmp/devpilot-page.html
          done
          curl -fsS -L https://devpilot-ai-two.vercel.app/ -o /tmp/devpilot-home.html
          grep -qi "Request pilot access" /tmp/devpilot-home.html
          ! grep -qiE "Run Demo|Demo Mode|Judge Mode" /tmp/devpilot-home.html
          demo_status="$(curl -sS -L -o /tmp/devpilot-demo.html -w "%{http_code}" "https://devpilot-ai-two.vercel.app/demo")"
          test "$demo_status" = "404"

      - name: Check backend readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://devpilot-ai-api-xkmg.onrender.com/health | tee /tmp/health.json
          curl -fsS https://devpilot-ai-api-xkmg.onrender.com/ready | tee /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json

      - name: Check auth and SSO config endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Origin: https://devpilot-ai-two.vercel.app" \
            https://devpilot-ai-api-xkmg.onrender.com/auth/session \
            | tee /tmp/session.json
          curl -fsS \
            -H "Origin: https://devpilot-ai-two.vercel.app" \
            https://devpilot-ai-api-xkmg.onrender.com/auth/sso/config \
            | tee /tmp/sso.json
          curl -fsS https://devpilot-ai-api-xkmg.onrender.com/openapi.json \
            | tee /tmp/openapi.json
          grep -q '"authenticated":false' /tmp/session.json
          grep -q '"provider_name"' /tmp/sso.json
          grep -q '"/pilot/leads"' /tmp/openapi.json
          ! grep -q '"/demo/run"' /tmp/openapi.json
